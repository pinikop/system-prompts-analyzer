# Agent registry: maps agent IDs to their prompt and tool files.
# Paths are relative to the data/ submodule root.
# "current: true" = show on dashboard. Older versions appear only in detail view.

claude-code:
  name: Claude Code
  vendor: Anthropic
  prompts:
    - label: "v1.0"
      path: "Anthropic/Claude Code/Prompt.txt"
    - label: "v2.0"
      path: "Anthropic/Claude Code 2.0.txt"
      current: true
  tools:
    - path: "Anthropic/Claude Code/Tools.json"

cursor:
  name: Cursor
  vendor: Anysphere
  prompts:
    - label: "Agent v1.0"
      path: "Cursor Prompts/Agent Prompt v1.0.txt"
    - label: "Agent v1.2"
      path: "Cursor Prompts/Agent Prompt v1.2.txt"
    - label: "Agent 2.0"
      path: "Cursor Prompts/Agent Prompt 2.0.txt"
    - label: "Agent 2025-09-03"
      path: "Cursor Prompts/Agent Prompt 2025-09-03.txt"
      current: true
    - label: "Agent CLI 2025-08-07"
      path: "Cursor Prompts/Agent CLI Prompt 2025-08-07.txt"
    - label: "Chat"
      path: "Cursor Prompts/Chat Prompt.txt"
  tools:
    - path: "Cursor Prompts/Agent Tools v1.0.json"

windsurf:
  name: Windsurf
  vendor: Codeium
  prompts:
    - label: "Wave 11"
      path: "Windsurf/Prompt Wave 11.txt"
      current: true
  tools:
    - path: "Windsurf/Tools Wave 11.txt"
      format: txt

devin:
  name: Devin AI
  vendor: Cognition
  prompts:
    - label: "Main"
      path: "Devin AI/Prompt.txt"
      current: true
    - label: "DeepWiki"
      path: "Devin AI/DeepWiki Prompt.txt"

augment:
  name: Augment Code
  vendor: Augment
  prompts:
    - label: "Claude Sonnet 4"
      path: "Augment Code/claude-4-sonnet-agent-prompts.txt"
      model: claude-sonnet-4
      current: true
    - label: "GPT-5"
      path: "Augment Code/gpt-5-agent-prompts.txt"
      model: gpt-5
      current: true
  tools:
    - path: "Augment Code/claude-4-sonnet-tools.json"
    - path: "Augment Code/gpt-5-tools.json"

vscode-copilot:
  name: VSCode Agent (Copilot)
  vendor: Microsoft
  prompts:
    - label: "Main (generic)"
      path: "VSCode Agent/Prompt.txt"
    - label: "Claude Sonnet 4"
      path: "VSCode Agent/claude-sonnet-4.txt"
      model: claude-sonnet-4
      current: true
    - label: "GPT-4.1"
      path: "VSCode Agent/gpt-4.1.txt"
      model: gpt-4.1
      current: true
    - label: "GPT-4o"
      path: "VSCode Agent/gpt-4o.txt"
      model: gpt-4o
      current: true
    - label: "GPT-5"
      path: "VSCode Agent/gpt-5.txt"
      model: gpt-5
      current: true
    - label: "GPT-5 Mini"
      path: "VSCode Agent/gpt-5-mini.txt"
      model: gpt-5-mini
      current: true
    - label: "Gemini 2.5 Pro"
      path: "VSCode Agent/gemini-2.5-pro.txt"
      model: gemini-2.5-pro
      current: true

replit:
  name: Replit
  vendor: Replit
  prompts:
    - label: "Main"
      path: "Replit/Prompt.txt"
      current: true
  tools:
    - path: "Replit/Tools.json"

kiro:
  name: Kiro
  vendor: Amazon
  prompts:
    - label: "Vibe"
      path: "Kiro/Vibe_Prompt.txt"
      current: true
    - label: "Spec"
      path: "Kiro/Spec_Prompt.txt"
    - label: "Mode Classifier"
      path: "Kiro/Mode_Clasifier_Prompt.txt"

amp:
  name: Amp
  vendor: Sourcegraph
  prompts:
    - label: "Claude Sonnet 4"
      path: "Amp/claude-4-sonnet.yaml"
      format: yaml
      model: claude-sonnet-4
      current: true
    - label: "GPT-5"
      path: "Amp/gpt-5.yaml"
      format: yaml
      model: gpt-5
      current: true
